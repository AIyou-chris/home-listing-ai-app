# Target setup as of 2026-10-02 (the live services were created by hand, not from this file).
# ONE always-on service runs the web server, the 60-second background loop and the job queue.
# Retire home-listing-ai-worker and home-listing-ai-video-worker in the Render dashboard.
services:
  - type: web
    name: home-listing-ai-backend
    runtime: node
    region: oregon
    plan: starter
    autoDeploy: true
    buildCommand: npm install --include=dev --ignore-scripts && npm run build && cd backend && npm install --omit=dev --ignore-scripts && PUPPETEER_CACHE_DIR=/opt/render/project/src/backend/.cache/puppeteer npx puppeteer browsers install chrome
    startCommand: cd backend && node server.cjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_RUNTIME_MODE
        value: all
      - key: JOB_WORKER_ENABLED
        value: true
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/backend/.cache/puppeteer
